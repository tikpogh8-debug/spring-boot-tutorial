syntax = "proto3";

package com.tutorial.grpc;

option java_multiple_files = true;
option java_package = "com.tutorial.grpc.proto";

// Shared contract: used by the Java server, the Java client and the Python client.
service PingService {
  rpc Ping (PingRequest) returns (PingResponse);
}

message PingRequest {
  string message = 1;
  string sender = 2;
}

message PingResponse {
  string message = 1;
  int64 timestamp_millis = 2;
}
